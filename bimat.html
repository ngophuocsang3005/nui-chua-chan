<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giới thiệu coder | SangA6</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', 'Arial', sans-serif;
            background: #08080a;
            color: #f0f0f0;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden; /* Khóa cuộn màn hình khi intro đang chạy */
        }

        /* =========================================
           1. HIỆU ỨNG INTRO SHARINGAN TỐI THƯỢNG
        ========================================= */
        #sharingan-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        #sharingan-loader.fade-out {
            opacity: 0;
            visibility: hidden;
        }

        .loader-eye-wrapper {
            position: relative;
            width: 130px;
            height: 130px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loader-eye {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 0 25px rgba(255, 0, 0, 0.95));
            /* Xoay đúng 1 vòng 360 độ xuôi chiều kim đồng hồ */
            animation: sharinganSpin 1.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        .loader-text {
            margin-top: 25px;
            color: #ff3333;
            font-size: 13px;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-family: monospace;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.7);
            animation: pulseText 1s infinite alternate;
        }

        /* XOAY ĐÚNG 1 VÒNG 360 DEGREES TỪ 0 CHÍNH XÁC XUÔI CHIỀU */
        @keyframes sharinganSpin {
            0% {
                transform: rotate(0deg) scale(0.4);
                opacity: 0.2;
            }
            50% {
                transform: rotate(180deg) scale(1.15);
                opacity: 1;
            }
            100% {
                transform: rotate(360deg) scale(1);
                opacity: 1;
            }
        }

        @keyframes pulseText {
            from { opacity: 0.3; }
            to { opacity: 1; }
        }

        /* =========================================
           2. GIAO DIỆN CHÍNH DOANH NHÂN SANGA6
        ========================================= */
        .secret-container {
            max-width: 650px;
            width: 100%;
            text-align: center;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 24px;
            padding: 50px 30px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.9), 0 0 30px rgba(212, 175, 55, 0.1);
            backdrop-filter: blur(10px);
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 1s ease 0.3s, transform 1s ease 0.3s;
        }

        /* Hiện container sau khi intro xong */
        body.loaded .secret-container {
            opacity: 1;
            transform: translateY(0);
        }

        .avatar-frame {
            position: relative;
            width: 170px;
            height: 170px;
            margin: 0 auto 30px;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid #d4af37;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.4);
            transition: transform 0.5s ease;
        }

        .avatar-frame:hover .avatar-img {
            transform: scale(1.05);
            box-shadow: 0 0 35px rgba(212, 175, 55, 0.7);
        }

        .title {
            font-size: 13px;
            letter-spacing: 4px;
            color: #d4af37;
            text-transform: uppercase;
            margin-bottom: 25px;
            font-weight: 600;
        }

        .quote {
            font-size: clamp(20px, 4vw, 26px);
            font-style: italic;
            line-height: 1.6;
            color: #ffffff;
            margin-bottom: 30px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        .author {
            font-size: 16px;
            color: #888;
            font-weight: bold;
            margin-bottom: 40px;
        }

        .author span {
            color: #d4af37;
        }

        /* =========================================
           3. NÚT TRỞ VỀ LỒNG SHARINGAN XOAY 360°
        ========================================= */
        .back-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 12px 30px;
            border-radius: 50px;
            background: #111115;
            border: 1px solid rgba(255, 51, 51, 0.5);
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.2);
            cursor: pointer;
        }

        /* Con mắt Sharingan nhỏ trong nút */
        .btn-sharingan-icon {
            width: 24px;
            height: 24px;
            object-fit: contain;
            filter: drop-shadow(0 0 5px #ff0000);
            transition: transform 0.6s ease;
        }

        /* Hiệu ứng HOVER nút: Sharingan xoay đúng 1 vòng & phát sáng */
        .back-btn:hover {
            background: #1a0505;
            border-color: #ff3333;
            color: #ff4d4d;
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.6);
            transform: translateY(-3px) scale(1.03);
        }

        .back-btn:hover .btn-sharingan-icon {
            transform: rotate(360deg) scale(1.2);
        }
    </style>
</head>

<body>

    <!-- INTRO LOADING SHARINGAN -->
    <div id="sharingan-loader">
        <div class="loader-eye-wrapper">
            <img src="sharingan.png" alt="Sharingan" class="loader-eye">
        </div>
        <div class="loader-text">KAMUI !!!</div>
    </div>

    <!-- NỘI DUNG TRANG BÍ MẬT -->
    <div class="secret-container">
        <div class="avatar-frame">
            <img src="avatar.jpg" alt="Doanh nhân SangA6" class="avatar-img">
        </div>

        <p class="title">Triết Lý </p>

        <blockquote class="quote">
            "Ở đời tôi chả nể ai, chỉ nể hòn đá anh trai người Tây."
        </blockquote>

        <p class="author">— CEO & Dev: <span>Uchiha SangA6</span> —</p>

        <!-- NÚT TRỞ VỀ KÈM ICON SHARINGAN -->
        <a href="index.html" class="back-btn">
            <img src="sharingan.png" alt="Sharingan Icon" class="btn-sharingan-icon">
            <span>Giải ảo thuật</span>
        </a>
    </div>

    <script>
        // Tự động tắt màn hình Intro Sharingan sau 1.8 giây
        window.addEventListener("load", function () {
            setTimeout(function () {
                const loader = document.getElementById("sharingan-loader");
                loader.classList.add("fade-out");
                document.body.classList.add("loaded");
                document.body.style.overflow = "auto";
            }, 1800);
        });
    </script>

</body>
</html>
